name: Deploy

# Builds the static site and deploys it to Cloudflare Pages: on every push to
# main (bin/publish pushes content), once a day so date-based states (Next
# Event, Past Event, New Release, pre-order) stay current, and by hand.
on:
  push:
    branches: [ main ]
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

# One deploy at a time, in order
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      # Stock from Bandcamp onto this build's copy of the content, so the
      # daily rebuild keeps stock current even without a publish (read only on
      # Bandcamp's side; without the keys, or if Bandcamp doesn't answer, the
      # build carries on with the stock last published)
      - name: Stock from Bandcamp
        env:
          RAILS_ENV: production
          SECRET_KEY_BASE_DUMMY: 1
          BANDCAMP_CLIENT_ID: ${{ secrets.BANDCAMP_CLIENT_ID }}
          BANDCAMP_CLIENT_SECRET: ${{ secrets.BANDCAMP_CLIENT_SECRET }}
        run: bin/rails bandcamp:stock

      # Fails (and nothing is deployed) if a page is missing or points back at
      # Rails or at localhost. Needs no media keys: images and audio are linked
      # on R2's public address, built from the keys in the content database.
      - name: Build the static site
        env:
          SITE_URL: https://margate-electronics.org
        run: bin/static-build

      # The Pages project is created on the first run; after that the API
      # answers 409 (already exists), which is fine
      - name: Make sure the Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          status=$(curl -s -o response.json -w '%{http_code}' -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
            --data '{"name":"margate-electronics","production_branch":"main"}')
          echo "Cloudflare answered $status"
          case "$status" in
            200) echo "Created the Pages project" ;;
            409) echo "The Pages project already exists" ;;
            *) cat response.json; exit 1 ;;
          esac

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build --project-name=margate-electronics --branch=main
